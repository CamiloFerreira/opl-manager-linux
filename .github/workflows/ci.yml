name: CI

on:
  push:
    branches: [main]
  pull_request:

# mínimo privilegio: el CI solo lee el código
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Comprobar sintaxis
        run: python3 -m py_compile oplcore.py opl_manager.py updater.py tray.py pops.py
      - name: Pruebas
        run: python3 -m unittest discover -s tests -v
      - name: Análisis estático de seguridad (bandit)
        run: |
          python3 -m venv /tmp/sec && /tmp/sec/bin/pip install -q "bandit==1.9.2"
          /tmp/sec/bin/bandit -ll -r oplcore.py opl_manager.py updater.py tray.py pops.py
      - name: Construir paquetes (sin firmar)
        run: ./packaging/make-release.sh
      - name: Probar instalación del .deb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./dist/release/opl-manager_*_all.deb
          test -x /usr/bin/opl-manager
          python3 -c "import gi; gi.require_version('Gtk','4.0'); gi.require_version('Adw','1'); from gi.repository import Gtk, Adw; print('GTK', Gtk.MAJOR_VERSION, Gtk.MINOR_VERSION)"
