name: Release

# Publica un release al subir un tag vX.Y.Z (que debe coincidir con __version__ en oplcore.py).
# Los archivos se firman con Ed25519 (secreto RELEASE_SIGNING_KEY) y llevan atestación de procedencia.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write        # crear el release
      id-token: write        # atestación de procedencia (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Comprobar que el tag coincide con la versión
        run: |
          V=$(python3 -c 'import re; print(re.search(r"__version__ = \"([^\"]+)\"", open("oplcore.py").read())[1])')
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con __version__ = $V"
            exit 1
          fi

      - name: Pruebas
        run: python3 -m unittest discover -s tests -v

      - name: Análisis estático de seguridad (bandit)
        run: |
          python3 -m venv /tmp/sec && /tmp/sec/bin/pip install -q "bandit==1.9.2"
          /tmp/sec/bin/bandit -ll -r oplcore.py opl_manager.py updater.py tray.py

      - name: Construir y firmar paquetes
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          OPL_REQUIRE_SIGNATURE: "1"
        run: |
          umask 077
          KEY="$RUNNER_TEMP/signing.pem"
          trap 'shred -u "$KEY" 2>/dev/null || rm -f "$KEY"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$KEY"
          OPL_SIGNING_KEY_FILE="$KEY" ./packaging/make-release.sh

      - name: Probar instalación del .deb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./dist/release/opl-manager_*_all.deb
          test -x /usr/bin/opl-manager

      - name: Atestación de procedencia (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/opl-manager
            dist/release/opl-manager_*_all.deb
            dist/release/opl-manager-linux-*.tar.gz

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "OPL Manager ${GITHUB_REF_NAME#v}" \
            --notes-file dist/release-notes.md \
            --generate-notes \
            --verify-tag
